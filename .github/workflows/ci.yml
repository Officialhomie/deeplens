name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

defaults:
  run:
    working-directory: extension

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Generate icons
        run: npm run icons

      - name: Production build
        run: npm run build

      # The E2E suite drives a real Chrome with the extension loaded, which
      # needs a display server on Linux — MV3 extensions cannot load headless.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Package ZIP (runs preflight)
        run: npm run zip

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: deeplens-extension-${{ github.sha }}
          path: extension/release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: extension/playwright-report
          retention-days: 7
